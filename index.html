<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="新生資料與辦理進度查詢">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23267447%22/><path d=%22M18 18h28v7H18zm0 12h28v7H18zm0 12h18v7H18z%22 fill=%22white%22/></svg>">
  <title>新生資料查詢</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f7f5;
      --surface: #ffffff;
      --text: #1f2933;
      --muted: #64748b;
      --border: #dbe4df;
      --primary: #267447;
      --primary-hover: #1f603b;
      --success-bg: #dff2cf;
      --success-text: #28643a;
      --danger-bg: #ffd9d5;
      --danger-text: #a42f28;
      --neutral-bg: #e8ecef;
      --neutral-text: #52606d;
      --focus: #90c7a8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      line-height: 1.55;
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 48px auto;
    }

    .panel,
    .record-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.07);
    }

    .panel {
      padding: clamp(24px, 5vw, 40px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4vw, 2rem);
      text-align: center;
    }

    .intro {
      margin: 8px 0 28px;
      color: var(--muted);
      text-align: center;
    }

    .form-field + .form-field {
      margin-top: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 650;
    }

    input,
    select {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #b7c5bd;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
      outline: 3px solid var(--focus);
      outline-offset: 1px;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.68;
    }

    .message {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--neutral-bg);
      color: var(--neutral-text);
    }

    .message.error {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .results {
      margin-top: 24px;
    }

    .record-card {
      overflow: hidden;
    }

    .record-card + .record-card {
      margin-top: 20px;
    }

    .record-heading {
      margin: 0;
      padding: 15px 20px;
      background: var(--primary);
      color: #fff;
      font-size: 1.05rem;
    }

    .record-list {
      margin: 0;
    }

    .record-row {
      display: grid;
      grid-template-columns: minmax(130px, 38%) 1fr;
      gap: 16px;
      align-items: center;
      padding: 13px 20px;
      border-top: 1px solid var(--border);
    }

    .record-row:first-child {
      border-top: 0;
    }

    dt {
      font-weight: 650;
    }

    dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    select {
      appearance: auto;
    }

    .field-note {
      display: block;
      margin-top: 5px;
      color: var(--muted);
    }

    .record-actions {
      padding: 0 20px 20px;
      border-top: 1px solid var(--border);
    }

    .record-actions button {
      margin-top: 20px;
    }

    .status {
      display: inline-block;
      min-width: 86px;
      padding: 4px 12px;
      border-radius: 999px;
      text-align: center;
      font-weight: 700;
    }

    .status.success {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status.danger {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .status.neutral {
      background: var(--neutral-bg);
      color: var(--neutral-text);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 560px) {
      main {
        margin: 20px auto;
      }

      .record-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-labelledby="page-title">
      <h1 id="page-title">新生資料查詢</h1>
      <p class="intro">請輸入試算表中登記的姓名與電話。</p>

      <form id="search-form" novalidate>
        <div class="form-field">
          <label for="name">姓名</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="80" required>
        </div>

        <div class="form-field">
          <label for="phone">電話</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="40" aria-describedby="phone-help" required>
          <small id="phone-help">可以輸入空格或連字號，系統比對時會自動忽略。</small>
        </div>

        <button id="search-button" type="submit">查詢</button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite" hidden></div>
    </section>

    <section id="results" class="results" aria-label="查詢結果" aria-live="polite"></section>
  </main>

  <script src="config.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
